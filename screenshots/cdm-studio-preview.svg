<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#0b1324"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="960" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="30" cy="25" r="8" fill="#38bdf8"/>
  <text x="50" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">CDMForge Pro</text>
  <text x="165" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">v1.0.0</text>
  <text x="220" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">CCSDS 508.0-B-1 Conjunction Assessment Studio</text>
  <rect x="840" y="12" width="95" height="26" rx="4" fill="#059669"/>
  <text x="887" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10/10 PASS</text>

  <!-- Left Column: Encounter B-Plane Radar -->
  <rect x="20" y="70" width="440" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2D ENCOUNTER B-PLANE COLLISION RADAR</text>

  <!-- Radar Canvas Area -->
  <rect x="35" y="112" width="410" height="240" rx="6" fill="#040812" stroke="#1e293b"/>
  <!-- Range Rings -->
  <circle cx="240" cy="232" r="100" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="240" cy="232" r="70" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="240" cy="232" r="40" fill="none" stroke="#1e293b" stroke-width="1"/>
  <line x1="240" y1="120" x2="240" y2="344" stroke="#1e293b"/>
  <line x1="45" y1="232" x2="435" y2="232" stroke="#1e293b"/>

  <!-- Primary Object at Center -->
  <circle cx="240" cy="232" r="6" fill="#38bdf8"/>
  <text x="250" y="228" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">STARLINK-31042 (Primary)</text>

  <!-- Secondary Object Miss Point & Error Ellipses -->
  <!-- Miss Vector -->
  <line x1="240" y1="232" x2="310" y2="180" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- 3-Sigma Ellipse -->
  <ellipse cx="310" cy="180" rx="65" ry="32" transform="rotate(-25 310 180)" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <!-- 2-Sigma Ellipse -->
  <ellipse cx="310" cy="180" rx="44" ry="22" transform="rotate(-25 310 180)" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1"/>
  <!-- 1-Sigma Ellipse -->
  <ellipse cx="310" cy="180" rx="24" ry="12" transform="rotate(-25 310 180)" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="310" cy="180" r="4" fill="#f43f5e"/>
  <text x="320" y="175" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">COSMOS 2251 DEB</text>

  <!-- Alert Banner -->
  <rect x="35" y="365" width="410" height="42" rx="4" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e"/>
  <text x="48" y="383" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RED ALERT: EMERGENCY MANEUVER REQUIRED</text>
  <text x="48" y="398" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10">Collision Probability Pc = 1.987e-04 exceeds 1.0e-04 threshold.</text>

  <!-- Metrics Grid -->
  <rect x="35" y="420" width="95" height="45" rx="4" fill="#0f172a"/>
  <text x="45" y="435" fill="#94a3b8" font-size="9" font-family="sans-serif">MISS DISTANCE</text>
  <text x="45" y="455" fill="#fff" font-size="13" font-family="monospace" font-weight="bold">142.50 m</text>

  <rect x="140" y="420" width="95" height="45" rx="4" fill="#0f172a"/>
  <text x="150" y="435" fill="#94a3b8" font-size="9" font-family="sans-serif">PROBABILITY (Pc)</text>
  <text x="150" y="455" fill="#f43f5e" font-size="13" font-family="monospace" font-weight="bold">1.987e-04</text>

  <rect x="245" y="420" width="95" height="45" rx="4" fill="#0f172a"/>
  <text x="255" y="435" fill="#94a3b8" font-size="9" font-family="sans-serif">REL SPEED</text>
  <text x="255" y="455" fill="#fff" font-size="13" font-family="monospace" font-weight="bold">11.42 km/s</text>

  <rect x="350" y="420" width="95" height="45" rx="4" fill="#0f172a"/>
  <text x="360" y="435" fill="#94a3b8" font-size="9" font-family="sans-serif">1-SIGMA MAJOR</text>
  <text x="360" y="455" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">32.4 m</text>

  <!-- Right Column: KVN Output & Compliance -->
  <rect x="480" y="70" width="460" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="500" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CCSDS 508.0-B-1 CONJUNCTION DATA MESSAGE (KVN)</text>

  <rect x="500" y="112" width="420" height="385" rx="6" fill="#050914" stroke="#1e293b"/>
  <text x="515" y="136" fill="#64748b" font-family="monospace" font-size="11">CCSDS_CDM_VERS = 1.0</text>
  <text x="515" y="152" fill="#64748b" font-family="monospace" font-size="11">CREATION_DATE  = 2026-10-16T12:00:00.000Z</text>
  <text x="515" y="168" fill="#64748b" font-family="monospace" font-size="11">ORIGINATOR     = CDMFORGE_PRO_SSA</text>
  <text x="515" y="190" fill="#38bdf8" font-family="monospace" font-size="11">TCA            = 2026-10-17T03:42:18.520Z</text>
  <text x="515" y="206" fill="#f8fafc" font-family="monospace" font-size="11">MISS_DISTANCE  = 142.500 [m]</text>
  <text x="515" y="222" fill="#f8fafc" font-family="monospace" font-size="11">RELATIVE_SPEED = 11.4200 [km/s]</text>
  <text x="515" y="238" fill="#f43f5e" font-family="monospace" font-size="11">COLLISION_PROBABILITY        = 1.987000e-04</text>
  <text x="515" y="254" fill="#64748b" font-family="monospace" font-size="11">COLLISION_PROBABILITY_METHOD = FOSTER-1992</text>
  <text x="515" y="278" fill="#38bdf8" font-family="monospace" font-size="11">OBJECT = OBJECT1</text>
  <text x="515" y="294" fill="#cbd5e1" font-family="monospace" font-size="11">OBJECT_NAME = STARLINK-31042</text>
  <text x="515" y="310" fill="#10b981" font-family="monospace" font-size="11">MANEUVERABLE = YES</text>
  <text x="515" y="326" fill="#cbd5e1" font-family="monospace" font-size="11">HARD_BODY_RADIUS = 4.50 [m]</text>
  <text x="515" y="350" fill="#f43f5e" font-family="monospace" font-size="11">OBJECT = OBJECT2</text>
  <text x="515" y="366" fill="#cbd5e1" font-family="monospace" font-size="11">OBJECT_NAME = COSMOS 2251 DEB</text>
  <text x="515" y="382" fill="#f43f5e" font-family="monospace" font-size="11">MANEUVERABLE = NO</text>
  <text x="515" y="398" fill="#cbd5e1" font-family="monospace" font-size="11">HARD_BODY_RADIUS = 0.80 [m]</text>
  <text x="515" y="422" fill="#10b981" font-family="monospace" font-size="11">[10/10 PASS] NORMATIVE SCORECARD CERTIFIED</text>
</svg>
